name: Updater package

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  package-after-tests:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build updater archive
        run: |
          commit="$(git rev-parse HEAD)"
          bash scripts/package-update-tools.sh "${commit:0:12}" "$commit"

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lums-update-tools-${{ github.event.workflow_run.head_sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish-release-archive:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests before publishing
        run: python -m pytest -q

      - name: Build updater archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          commit="$(git rev-parse HEAD)"
          bash scripts/package-update-tools.sh "$RELEASE_TAG" "$commit"

      - name: Attach archive and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
