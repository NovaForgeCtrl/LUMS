<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>LUMS Login</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <h1>LUMS</h1>
            <p>Linux Update Management Server</p>

            <h2>Administrator Login</h2>

            {% if error %}
                <div class="error-message" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post" action="{{ url_for('login') }}">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    maxlength="64"
                    value="{{ username or '' }}"
                    required
                    autofocus
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Login
                </button>
            </form>
        </section>
    </main>
</body>
</html>
