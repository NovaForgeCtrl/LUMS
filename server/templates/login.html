<!DOCTYPE html>
<html lang="{{ language }}" data-locale="{{ language_locale }}">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>LUMS // {{ tr("System Login") }}</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-brand">
            <div class="login-brand-main">
                segfault <span>//</span> override
            </div>

            <div class="login-brand-sub">
                {{ tr("Linux Update Management Server") }}
            </div>
        </div>

        <div class="login-theme-selector">
            <label for="login-theme-select">{{ tr("Theme") }}</label>
            <select id="login-theme-select">
                <option value="standard">🖥️ {{ tr("Standard LUMS") }}</option>
                <option value="LUMSStadium">🏈 {{ tr("LUMS Stadium") }}</option>
                <option value="golf">⛳ {{ tr("Golf Club") }}</option>
                <option value="nerd">🤓 {{ tr("Nerd Mode") }}</option>
                <option value="geek">🧠 {{ tr("Geek Lab") }}</option>
                <option value="admin">🗄️ {{ tr("Enterprise Admin") }}</option>
            </select>
        </div>

        <form action="/language" method="POST" class="login-language-selector">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="login-language-select">{{ tr("Language") }}</label>
            <select id="login-language-select" name="language" aria-label="{{ tr('Language') }}">
                {% for code, name in languages.items() %}
                <option value="{{ code }}" {% if code == language %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </form>

        <section class="login-card">

            <div class="login-card-header">
                <span class="login-status-dot"></span>
                <span>{{ tr("SECURE ACCESS") }}</span>
            </div>

            <h1>{{ tr("System Login") }}</h1>

            <p class="login-description">
                {{ tr("Authenticate to access the LUMS management interface.") }}
            </p>

            {% if error %}
            <div class="login-error">
                {{ tr(error) }}
            </div>
            {% endif %}

            <form method="post" class="login-form">

                <div class="login-field">
                    <label for="username">{{ tr("Username") }}</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="login-field">
                    <label for="password">{{ tr("Password") }}</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >
                <input type="hidden" name="language" value="{{ language }}">

                <button
                    type="submit"
                    class="login-button">
                    {{ tr("Sign in") }}
                </button>

            </form>

            <div class="login-footer">
                LUMS // {{ tr("Internal management system") }}
            </div>

        </section>

    </main>

    <script
        src="{{ url_for('static', filename='theme.js') }}"
    ></script>

</body>
</html>
